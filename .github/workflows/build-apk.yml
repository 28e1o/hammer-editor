name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias hammer -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hammerpass -keypass hammerpass \
            -dname "CN=Hammer, OU=Local, O=Local, L=City, ST=State, C=US"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: hammerpass
          RELEASE_KEY_ALIAS: hammer
          RELEASE_KEY_PASSWORD: hammerpass
        run: ./gradlew :android:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: hammer-release-apk
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error